[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-coordination"
version = "0.1.0"
description = "Multi-agent organization experiments and development entrypoint"
license = {text = "MIT"}
requires-python = ">=3.9"
dependencies = []

[project.scripts]
agent-coordination = "agent_coordination.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

